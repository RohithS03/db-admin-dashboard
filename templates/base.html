<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DB Admin Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="sidebar">
        <h2>🗄️ DB Admin</h2>
        <a href="/">Dashboard Home</a>
        <a href="/query">SQL Console</a>
        <hr>
        <h3>Tables</h3>
        {% for t in tables %}
            <a href="/table/{{ t }}">📋 {{ t }}</a>
        {% endfor %}
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
