{% extends "base.html" %}
{% block content %}
    <h1>Table: {{ table_name }}</h1>
    <table class="data-table">
        <thead>
            <tr>{% for col in columns %}<th>{{ col }}</th>{% endfor %}</tr>
        </thead>
        <tbody>
            {% for row in rows %}
                <tr>{% for cell in row %}<td>{{ cell }}</td>{% endfor %}</tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
